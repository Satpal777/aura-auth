<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · Aura Auth</title>
  <link rel="icon" type="image/png" href="./assets/AA.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          keyframes: {
            spin: { to: { transform: 'rotate(360deg)' } },
            fadeIn: { from: { opacity: 0, transform: 'translateY(6px)' }, to: { opacity: 1, transform: 'translateY(0)' } }
          },
          animation: {
            spin: 'spin 0.7s linear infinite',
            fadeIn: 'fadeIn 0.3s ease-out'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="h-full bg-zinc-50 dark:bg-zinc-950 font-sans antialiased flex items-center justify-center p-4 sm:p-7">

  <div
    class="w-full max-w-[420px] bg-white dark:bg-zinc-900 sm:rounded-2xl sm:shadow-[0_8px_30px_rgb(0,0,0,0.04)] sm:border border-zinc-100 dark:border-zinc-800 p-6 sm:p-7 animate-fadeIn relative overflow-hidden">
    <!-- Subtle top gradient -->
    <div
      class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 opacity-80">
    </div>

    <!-- Logo -->
    <div class="flex justify-center mb-4 mt-2">
      <img src="./assets/AA.png" alt="Aura Auth"
        class="w-12 h-12 rounded-xl object-contain shadow-sm ring-1 ring-zinc-900/5 dark:ring-white/10" />
    </div>

    <div class="mb-8 text-center">
      <h2 class="text-2xl font-semibold text-zinc-900 dark:text-white tracking-tight">Create an account</h2>
      <p id="clientSubtitle" class="text-sm text-zinc-500 dark:text-zinc-400 mt-1.5 hidden">to continue to Aura Auth</p>
    </div>

    <!-- Error banner -->
    <div id="errorMsg" role="alert" aria-live="assertive"
      class="hidden mb-6 flex items-start gap-2.5 text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800/60 rounded-xl px-4 py-3">
      <svg class="w-4 h-4 mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span id="errorText"></span>
    </div>

    <!-- Success banner -->
    <div id="successMsg" role="status" aria-live="polite"
      class="hidden mb-6 flex items-start gap-2.5 text-sm text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 rounded-xl px-4 py-3">
      <svg class="w-4 h-4 mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <polyline points="9 12 11 14 15 10" />
      </svg>
      <span id="successText"></span>
    </div>

    <form id="signupForm" novalidate class="space-y-5">

      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
          <label for="firstName" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">First
            name</label>
          <input id="firstName" name="firstName" type="text" autocomplete="given-name" required
            class="w-full h-11 px-4 text-sm text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:focus:border-indigo-400" />
        </div>
        <div class="space-y-2">
          <label for="lastName" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">Last name</label>
          <input id="lastName" name="lastName" type="text" autocomplete="family-name"
            class="w-full h-11 px-4 text-sm text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:focus:border-indigo-400" />
        </div>
      </div>

      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required
          class="w-full h-11 px-4 text-sm text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:focus:border-indigo-400" />
      </div>

      <div class="space-y-2">
        <label for="password" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">Password</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="new-password"
            placeholder="Min. 8 characters" required
            class="w-full h-11 px-4 pr-11 text-sm text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:focus:border-indigo-400" />
          <button type="button" id="togglePw" aria-label="Toggle password visibility"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-lg text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition hover:bg-zinc-100 dark:hover:bg-zinc-800">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <!-- Password strength bar -->
        <div class="flex gap-1 mt-2" id="strengthBars">
          <div class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-700 transition-colors" data-bar="0"></div>
          <div class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-700 transition-colors" data-bar="1"></div>
          <div class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-700 transition-colors" data-bar="2"></div>
          <div class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-zinc-700 transition-colors" data-bar="3"></div>
        </div>
        <p id="strengthLabel" class="text-xs text-zinc-400 dark:text-zinc-500"></p>
      </div>

      <div class="space-y-2">
        <label for="confirmPassword" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">Confirm
          password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required
          class="w-full h-11 px-4 text-sm text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:focus:border-indigo-400" />
        <p id="confirmHint" class="hidden text-xs text-red-500 mt-1">Passwords do not match</p>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full h-11 flex items-center justify-center gap-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 rounded-xl transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed mt-4">
        <span id="spinner"
          class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span id="btnText">Create account</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-zinc-100 dark:border-zinc-800">
      <p class="text-center text-sm text-zinc-500 dark:text-zinc-400">
        Already have an account?
        <a id="signinLink" href="/o/authenticate"
          class="font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition">Sign
          in</a>
      </p>
    </div>

  </div>

  <script>
    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const successMsg = document.getElementById('successMsg');
    const successText = document.getElementById('successText');
    const pwInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const confirmHint = document.getElementById('confirmHint');
    const strengthBars = document.querySelectorAll('[data-bar]');
    const strengthLabel = document.getElementById('strengthLabel');
    const signinLink = document.getElementById('signinLink');

    // Preserve OAuth params
    const params = new URLSearchParams(window.location.search);
    if (params.toString()) signinLink.href = `/o/authenticate?${params.toString()}`;

    // Update client name if present
    const clientName = params.get('client_name');
    if (clientName) {
      const subtitle = document.getElementById('clientSubtitle');
      if (subtitle) {
        subtitle.textContent = `to continue to ${clientName}`;
        subtitle.classList.remove('hidden');
      }
      document.title = `Create Account for ${clientName} · Aura Auth`;
    }

    // Toggle password visibility
    document.getElementById('togglePw').addEventListener('click', () => {
      pwInput.type = pwInput.type === 'text' ? 'password' : 'text';
    });

    // Password strength meter
    function getStrength(pw) {
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if (/[0-9]/.test(pw) || /[^A-Za-z0-9]/.test(pw)) score++;
      return score; // 0–4
    }

    const strengthColors = ['bg-red-500', 'bg-orange-400', 'bg-yellow-400', 'bg-emerald-500'];
    const strengthLabels = ['Too weak', 'Weak', 'Fair', 'Strong'];

    pwInput.addEventListener('input', () => {
      const score = pwInput.value.length === 0 ? 0 : getStrength(pwInput.value);
      strengthBars.forEach((bar, i) => {
        bar.className = `h-1 flex-1 rounded-full transition-colors ${pwInput.value.length === 0 ? 'bg-zinc-200 dark:bg-zinc-700'
          : i < score ? strengthColors[score - 1]
            : 'bg-zinc-200 dark:bg-zinc-700'
          }`;
      });
      strengthLabel.textContent = pwInput.value.length === 0 ? '' : strengthLabels[Math.max(0, score - 1)];
    });

    // Confirm password live validation
    confirmInput.addEventListener('input', () => {
      const mismatch = confirmInput.value && confirmInput.value !== pwInput.value;
      confirmHint.classList.toggle('hidden', !mismatch);
      confirmInput.setAttribute('aria-invalid', mismatch ? 'true' : 'false');
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.remove('hidden');
      errorMsg.classList.add('flex');
      successMsg.classList.add('hidden');
      successMsg.classList.remove('flex');
    }

    function showSuccess(msg) {
      successText.textContent = msg;
      successMsg.classList.remove('hidden');
      successMsg.classList.add('flex');
      errorMsg.classList.add('hidden');
      errorMsg.classList.remove('flex');
    }

    function setLoading(on) {
      submitBtn.disabled = on;
      spinner.classList.toggle('hidden', !on);
      btnText.textContent = on ? 'Creating account…' : 'Create account';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = pwInput.value;
      const confirmPassword = confirmInput.value;

      if (!firstName || !email || !password || !confirmPassword) {
        showError('Please fill in all required fields.');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/o/authenticate/sign-up', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, password }),
        });

        console.log(res);

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showError(data.error || 'Something went wrong. Please try again.');
          return;
        }

        showSuccess('Account created! Redirecting to sign in…');
        setTimeout(() => {
          // Preserve OAuth params when bouncing to sign-in
          window.location.href = `/o/authenticate${window.location.search}`;
        }, 1400);

      } catch {
        showError('Network error. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
