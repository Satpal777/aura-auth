<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Aura Auth</title>
  <link rel="icon" type="image/png" href="./assets/AA.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#6366f1', hover: '#4f46e5', ring: '#a5b4fc' }
          },
          keyframes: {
            spin: { to: { transform: 'rotate(360deg)' } },
            fadeIn: { from: { opacity: 0, transform: 'translateY(6px)' }, to: { opacity: 1, transform: 'translateY(0)' } }
          },
          animation: {
            spin: 'spin 0.7s linear infinite',
            fadeIn: 'fadeIn 0.3s ease-out'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body class="h-full bg-zinc-50 dark:bg-zinc-950 font-sans antialiased flex items-center justify-center p-4 sm:p-8">

  <div class="w-full max-w-[420px] bg-white dark:bg-zinc-900 sm:rounded-2xl sm:shadow-[0_8px_30px_rgb(0,0,0,0.04)] sm:border border-zinc-100 dark:border-zinc-800 p-6 sm:p-10 animate-fadeIn relative overflow-hidden">
    <!-- Subtle top gradient -->
    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 opacity-80"></div>

    <!-- Logo -->
    <div class="flex justify-center mb-8 mt-2">
      <img src="./assets/AA.png" alt="Aura Auth" class="w-12 h-12 rounded-xl object-contain shadow-sm ring-1 ring-zinc-900/5 dark:ring-white/10" />
    </div>

    <div class="mb-8 text-center">
      <h2 class="text-2xl font-semibold text-zinc-900 dark:text-white tracking-tight">Sign in</h2>
      <p id="clientSubtitle" class="text-sm text-zinc-500 dark:text-zinc-400 mt-1.5">to continue to Aura Auth</p>
    </div>

    <!-- Error banner -->
    <div id="errorMsg" role="alert" aria-live="assertive"
      class="hidden mb-6 flex items-start gap-2.5 text-sm text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800/60 rounded-xl px-4 py-3">
      <svg class="w-4 h-4 mt-0.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span id="errorText"></span>
    </div>

    <form id="loginForm" novalidate class="space-y-5">

      <div class="space-y-2">
        <label for="email" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required
          class="w-full h-11 px-4 text-sm text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:focus:border-indigo-400" />
      </div>

      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300">Password</label>
          <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300 transition">Forgot password?</a>
        </div>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="w-full h-11 px-4 pr-11 text-sm text-zinc-900 dark:text-white bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 rounded-xl placeholder-zinc-400 dark:placeholder-zinc-600 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:focus:border-indigo-400" />
          <button type="button" id="togglePw" aria-label="Toggle password visibility"
            class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-lg text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition hover:bg-zinc-100 dark:hover:bg-zinc-800">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full h-11 flex items-center justify-center gap-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 rounded-xl transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed mt-2">
        <span id="spinner"
          class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span id="btnText">Sign in</span>
      </button>

    </form>

    <div class="mt-8 pt-6 border-t border-zinc-100 dark:border-zinc-800">
      <p class="text-center text-sm text-zinc-500 dark:text-zinc-400">
        Don't have an account?
        <a id="signupLink" href="/o/signup"
          class="font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition">Create account</a>
      </p>
    </div>

  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const togglePw = document.getElementById('togglePw');
    const pwInput = document.getElementById('password');
    const signupLink = document.getElementById('signupLink');

    // Preserve OAuth params on signup link
    const params = new URLSearchParams(window.location.search);
    if (params.toString()) signupLink.href = `/o/signup?${params.toString()}`;

    // Update client name if present
    const clientName = params.get('client_name');
    if (clientName) {
      const subtitle = document.getElementById('clientSubtitle');
      if (subtitle) subtitle.textContent = `to continue to ${clientName}`;
      document.title = `Sign in to ${clientName} · Aura Auth`;
    }

    // Toggle password visibility
    togglePw.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.remove('hidden');
      errorMsg.classList.add('flex');
    }

    function hideError() {
      errorMsg.classList.add('hidden');
      errorMsg.classList.remove('flex');
    }

    function setLoading(on) {
      submitBtn.disabled = on;
      spinner.classList.toggle('hidden', !on);
      btnText.textContent = on ? 'Signing in…' : 'Sign in';
    }

    // Determine which flow we're in
    const isOAuthFlow = params.has('client_id') && params.has('redirect_uri');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = pwInput.value;

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      setLoading(true);
      try {
        if (isOAuthFlow) {
          // Authorization Code flow → POST to /o/authorize/callback
          const res = await fetch('/o/authorize/callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email, password,
              client_id: params.get('client_id'),
              redirect_uri: params.get('redirect_uri'),
              state: params.get('state') ?? '',
              scope: params.get('scope') ?? 'openid',
            }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showError(data.error || 'Invalid credentials. Please try again.');
            return;
          }

          // Backend returns { redirect_to: "http://localhost:3001/callback?code=..." }
          // We navigate the browser ourselves — fetch cannot follow cross-origin redirects.
          if (data.redirect_to) {
            window.location.href = data.redirect_to;
          } else {
            showError('Authentication failed: no redirect URL received.');
          }

        } else {
          const res = await fetch('/o/authenticate/sign-in', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showError(data.error || 'Invalid credentials. Please try again.');
            return;
          }

          if (data.token) {
            localStorage.setItem('aura_token', data.token);
            window.location.href = '/dashboard';
          }
        }
      } catch {
        showError('Network error. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
